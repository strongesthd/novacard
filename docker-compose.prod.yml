services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: novacard
      POSTGRES_USER: novacard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novacard -d novacard"]
      interval: 5s
      timeout: 5s
      retries: 20
  web:
    build: {context: ., dockerfile: apps/web/Dockerfile}
    restart: unless-stopped
    environment: {PORT: 3000, NODE_ENV: production, API_INTERNAL_URL: http://api:4000}
    ports: ["127.0.0.1:8889:3000"]
  api:
    build: {context: ., dockerfile: apps/api/Dockerfile}
    restart: unless-stopped
    environment:
      PORT: "4000"
      NODE_ENV: production
      DEMO_AUTH: "false"
      DATABASE_URL: "postgresql://novacard:${POSTGRES_PASSWORD}@db:5432/novacard"
      REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379"
      S3_ENDPOINT: "http://minio:9000"
      S3_REGION: "us-east-1"
      S3_BUCKET: "novacard-assets"
      S3_ACCESS_KEY: "minio"
      S3_SECRET_KEY: "${MINIO_ROOT_PASSWORD}"
      OCR_LANGUAGES: "eng+vie+kor"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      GEMINI_MODEL: "${GEMINI_MODEL:-gemini-2.0-flash}"
      OCR_TIMEOUT_MS: "60000"
      OCR_WORKER_CONCURRENCY: "1"
    depends_on:
      db:
        condition: service_healthy
    ports: ["127.0.0.1:4010:4000"]
    volumes:
      - novacard_data:/data
  ocr-worker:
    build: {context: ., dockerfile: apps/api/Dockerfile}
    restart: unless-stopped
    command: ["node", "dist/worker.js"]
    environment:
      NODE_ENV: production
      DATABASE_URL: "postgresql://novacard:${POSTGRES_PASSWORD}@db:5432/novacard"
      REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379"
      S3_ENDPOINT: "http://minio:9000"
      S3_REGION: "us-east-1"
      S3_BUCKET: "novacard-assets"
      S3_ACCESS_KEY: "minio"
      S3_SECRET_KEY: "${MINIO_ROOT_PASSWORD}"
      OCR_LANGUAGES: "eng+vie+kor"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      GEMINI_MODEL: "${GEMINI_MODEL:-gemini-2.0-flash}"
      OCR_TIMEOUT_MS: "60000"
      OCR_WORKER_CONCURRENCY: "1"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD}"
    volumes:
      - minio_data:/data
  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: /bin/sh
    command: -c 'until mc alias set local http://minio:9000 minio "$${MINIO_ROOT_PASSWORD}"; do sleep 2; done; mc mb --ignore-existing local/novacard-assets'
    environment:
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD}"

volumes:
  novacard_data:
  postgres_data:
  minio_data:
