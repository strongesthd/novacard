services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: novacard
      POSTGRES_USER: novacard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novacard -d novacard"]
      interval: 5s
      timeout: 5s
      retries: 20
  web:
    build: {context: ., dockerfile: apps/web/Dockerfile}
    restart: unless-stopped
    environment: {PORT: 3000, NODE_ENV: production, API_INTERNAL_URL: http://api:4000}
    ports: ["127.0.0.1:8889:3000"]
  api:
    build: {context: ., dockerfile: apps/api/Dockerfile}
    restart: unless-stopped
    environment: {PORT: 4000, NODE_ENV: production, DEMO_AUTH: "true", DATABASE_URL: postgresql://novacard:${POSTGRES_PASSWORD}@db:5432/novacard}
    depends_on:
      db:
        condition: service_healthy
    ports: ["127.0.0.1:4010:4000"]
    volumes:
      - novacard_data:/data

volumes:
  novacard_data:
  postgres_data:
